<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Star! ⭐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
    }
    .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #gameArea {
      position: relative;
      width: 100%;
      flex-grow: 1;
    }
    #target {
      position: absolute;
      font-size: 55px;
      cursor: pointer;
      display: none;
      transition: transform 0.1s;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
    }
    #target:active {
      transform: scale(1.3);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 10, 15, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 20;
    }
    h1 { font-size: 34px; margin-bottom: 10px; color: #ffd700; }
    p { font-size: 18px; color: #b2bec3; margin-bottom: 25px; max-width: 340px; }
    .btn {
      background: linear-gradient(135deg, #ffd700, #ff9f43);
      color: #1e272e;
      border: none;
      padding: 16px 36px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="hud">
    <div class="badge">⭐ Score: <span id="score">0</span></div>
    <div class="badge">⏱️ Time: <span id="time">20</span>s</div>
  </div>

  <div id="gameArea">
    <div id="target" onclick="catchTarget()">⭐</div>
  </div>

  <div class="overlay" id="startScreen">
    <h1>Catch the Star! 🚀</h1>
    <p id="message">Tap as many shooting stars as you can in 20 seconds!</p>
    <button class="btn" onclick="startGame()">Play Now</button>
  </div>

  <script>
    let score = 0;
    let timeLeft = 20;
    let gameTimer;
    let moveTimer;

    const target = document.getElementById('target');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time');
    const startScreen = document.getElementById('startScreen');
    const message = document.getElementById('message');
    const gameArea = document.getElementById('gameArea');

    function moveTarget() {
      const maxX = gameArea.clientWidth - 70;
      const maxY = gameArea.clientHeight - 70;
      const randomX = Math.max(10, Math.floor(Math.random() * maxX));
      const randomY = Math.max(10, Math.floor(Math.random() * maxY));
      target.style.left = randomX + 'px';
      target.style.top = randomY + 'px';
    }

    function catchTarget() {
      score++;
      scoreDisplay.innerText = score;
      moveTarget();
      clearInterval(moveTimer);
      moveTimer = setInterval(moveTarget, 950);
    }

    function startGame() {
      score = 0;
      timeLeft = 20;
      scoreDisplay.innerText = score;
      timeDisplay.innerText = timeLeft;
      startScreen.style.display = 'none';
      target.style.display = 'block';
      moveTarget();

      moveTimer = setInterval(moveTarget, 950);
      gameTimer = setInterval(() => {
        timeLeft--;
        timeDisplay.innerText = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearInterval(moveTimer);
      target.style.display = 'none';
      message.innerHTML = `Time's up! You caught <strong>${score} stars</strong>! 🌟<br>Can your friends beat your score?`;
      document.querySelector('.btn').innerText = 'Play Again';
      startScreen.style.display = 'flex';
    }
  </script>
</body>
</html>
